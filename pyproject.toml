[project]
name = "homeassistant-ivent-cloud"
version = "0.1.0"
description = "Home Assistant custom integration for the i-Vent Smart Home Cloud API"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
